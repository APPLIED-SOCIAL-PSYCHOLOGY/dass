<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>問答｜年齡與憂鬱、焦慮、壓力的關係</title>
<link rel="stylesheet" href="style.css">
<style>
.conn { margin-top: 24px; }
.conn button {
  font: inherit; padding: .55em 1.3em; cursor: pointer;
  color: var(--bg); background: var(--ink); border: 1px solid var(--ink); border-radius: 6px;
}
.conn button:disabled { opacity: .6; cursor: wait; }
.conn button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.conn pre {
  margin: 12px 0 0; padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
  font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: .9rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.conn pre[hidden] { display: none; }
.conn pre.err { border-color: #C0392B; color: #C0392B; }
</style>
</head>
<body>
<header class="site-header">
  <nav class="site-nav" aria-label="主要導覽">
    <a class="brand" href="index.html">DASS 年齡研究</a>
    <ul>
        <li><a class="nl" href="index.html">首頁</a></li>
        <li><a class="nl" href="results.html">研究結果</a></li>
        <li><a class="nl" href="ask.html" aria-current="page">問答</a></li>
        <li><a class="nl" href="about.html">關於研究</a></li>
    </ul>
    <div class="bgpicker">
  <span class="sw" id="bgSwatch" aria-hidden="true"></span>
  <label for="bgSelect">背景顏色</label>
  <select id="bgSelect">
    <option value="auto">預設（跟隨系統）</option>
    <option value="#FFFFFF|light">白色</option>
    <option value="#F4F6F7|light">淺灰</option>
    <option value="#FBF6E9|light">米黃</option>
    <option value="#E8F1FA|light">淡藍</option>
    <option value="#E8F5EC|light">淡綠</option>
    <option value="#FBEDF1|light">淡粉</option>
    <option value="#F0EBF8|light">淡紫</option>
    <option value="#11181D|dark">深藍灰</option>
    <option value="#1E1E1E|dark">炭灰</option>
    <option value="#000000|dark">黑色</option>
  </select>
</div>
  </nav>
</header>
<main>
  <h1>問答</h1>
  <p class="lead">針對研究內容與結果的問答功能。</p>
  <section class="soon" aria-label="即將推出">
    <div class="badge">即將推出</div>
    <p>問答功能正在準備中，敬請期待。</p>
  </section>

  <section class="conn" aria-label="後端連線測試">
    <button type="button" id="testBtn">測試連線</button>
    <pre id="testOut" role="status" aria-live="polite" hidden></pre>
  </section>

  <section class="conn" aria-label="Gemini 測試">
    <button type="button" id="geminiBtn">測試 Gemini</button>
    <pre id="geminiOut" role="status" aria-live="polite" hidden></pre>
  </section>
</main>
<footer class="site-footer">
  <div class="in">
    <span>組別：（請填入組別）</span>
    <span>組員：（請填入組員姓名）</span>
  </div>
</footer>
<script>
(function () {
  var API_URL = 'https://dass-42.c44121298.workers.dev/';
  var btn = document.getElementById('testBtn');
  var out = document.getElementById('testOut');

  function show(text, isError) {
    out.textContent = text;
    out.className = isError ? 'err' : '';
    out.hidden = false;
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    show('連線中…', false);
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 10000);

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'test' }),
      signal: ctrl.signal
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) { data = null; }
        if (!res.ok) {
          var msg = data && data.error ? data.error : (txt || '伺服器沒有回傳說明');
          show('連線失敗（HTTP ' + res.status + '）：' + msg, true);
        } else if (data === null) {
          show('連線失敗：後端回傳的內容不是 JSON。\n' + txt, true);
        } else {
          show(JSON.stringify(data, null, 2), false);
        }
      });
    }).catch(function (err) {
      var msg = err && err.name === 'AbortError'
        ? '連線逾時（超過 10 秒沒有回應）。'
        : '無法連線到後端，請檢查網路，或確認後端網址與跨網域（CORS）設定。';
      show('連線失敗：' + msg, true);
    }).then(function () {
      clearTimeout(timer);
      btn.disabled = false;
    });
  });
})();
</script>
<script>
(function () {
  var API_URL = 'https://dass-42.c44121298.workers.dev/';
  var QUESTION = '請用一句話自我介紹';
  var btn = document.getElementById('geminiBtn');
  var out = document.getElementById('geminiOut');

  function show(text, isError) {
    out.textContent = text;
    out.className = isError ? 'err' : '';
    out.hidden = false;
  }

  btn.addEventListener('click', function () {
    btn.disabled = true;
    show('問題：' + QUESTION + '\n\n等待 Gemini 回覆中…', false);
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, 40000);

    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'ask', question: QUESTION }),
      signal: ctrl.signal
    }).then(function (res) {
      return res.text().then(function (txt) {
        var data;
        try { data = JSON.parse(txt); } catch (e) { data = null; }
        if (!res.ok) {
          var msg = data && data.error ? data.error : (txt || '伺服器沒有回傳說明');
          show('呼叫失敗（HTTP ' + res.status + '）：' + msg, true);
        } else if (data === null || typeof data.answer !== 'string') {
          show('呼叫失敗：後端回傳的內容格式不符。\n' + txt, true);
        } else {
          show('問題：' + QUESTION + '\n\n回覆：' + data.answer, false);
        }
      });
    }).catch(function (err) {
      var msg = err && err.name === 'AbortError'
        ? '連線逾時（超過 40 秒沒有回應）。'
        : '無法連線到後端，請檢查網路，或確認後端網址與跨網域（CORS）設定。';
      show('呼叫失敗：' + msg, true);
    }).then(function () {
      clearTimeout(timer);
      btn.disabled = false;
    });
  });
})();
</script>
<script>
(function () {
  var sel = document.getElementById('bgSelect'), sw = document.getElementById('bgSwatch'), root = document.documentElement;
  function apply(v) {
    if (v === 'auto') {
      root.removeAttribute('data-mode'); root.style.removeProperty('--bg');
    } else {
      var a = v.split('|'); root.setAttribute('data-mode', a[1]); root.style.setProperty('--bg', a[0]);
    }
  }
  try { var saved = localStorage.getItem('dash-bg'); if (saved) { sel.value = saved; if (sel.value !== saved) sel.value = 'auto'; } } catch (e) {}
  apply(sel.value);
  sel.addEventListener('change', function () {
    apply(sel.value);
    try { localStorage.setItem('dash-bg', sel.value); } catch (e) {}
  });
})();
</script>
</body>
</html>
